plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'org.jetbrains.kotlin.plugin.serialization' version "${kotlin_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        grandstrategy {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            runDir "run/client"
            programArgs "--quickPlayMultiplayer", "localhost:25565", "--username", "Tester"
            vmArg "-XX:ErrorFile=hs_err_%p.log"
            vmArg "-Dgrandstrategy.capture=" + (project.findProperty("capture") ?: "false")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    if (project.findProperty("withChunky") == "true") {
        runtimeOnly "maven.modrinth:chunky:4Eotm6ov"
    }

    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${project.kotlin_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def props = [
            "version"              : project.version,
            "minecraft_version"    : project.minecraft_version,
            "fabric_kotlin_version": project.fabric_kotlin_version,
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

kotlin {
    jvmToolchain(25)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed"
        showStandardStreams = true
    }
}

tasks.register("collect", Copy) {
    from tasks.named("jar")
    into layout.projectDirectory.dir("dist")
}

def localProps = new Properties()
def localFile = file("local.properties")
if (localFile.exists()) localFile.withReader("UTF-8") { localProps.load(it) }
def serverDir = project.findProperty("serverDir") ?: localProps.getProperty("serverDir") ?: System.getenv("MINELIZATION_SERVER")

tasks.register("deploy") {
    group = "distribution"
    description = "Builds the mod jar and installs it into <serverDir>/mods, replacing older builds."
    dependsOn tasks.named("jar")
    doLast {
        if (serverDir == null) {
            throw new GradleException("Set the server folder: -PserverDir=<path>, serverDir=<path> in local.properties, or MINELIZATION_SERVER")
        }
        def mods = file("${serverDir}/mods")
        if (!file(serverDir).isDirectory()) throw new GradleException("Server folder not found: ${serverDir}")
        mods.mkdirs()
        def built = tasks.jar.archiveFile.get().asFile
        fileTree(mods) { include "${project.archives_base_name}-*.jar" }.each { it.delete() }
        copy {
            from built
            into mods
        }
        println "Installed ${built.name} -> ${mods}"
    }
}
